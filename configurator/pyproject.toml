[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maidenhead-configurator"
version = "0.1.0"
description = "Configurator for the Maidenhead Pocket Locator"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
maidenhead-configurator = "maidenhead_configurator.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
