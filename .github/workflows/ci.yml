name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S firmware -B build/firmware
      - run: cmake --build build/firmware --config Release
      - run: ctest --test-dir build/firmware -C Release --output-on-failure

  configurator:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e "./configurator[dev]"
      - run: python -m pytest configurator/tests
      - run: python -m ruff check configurator
